<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keith Bryan Sugnot | Official Website</title>

<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}
header{text-align:center;padding:40px;background:linear-gradient(135deg,#1e3c72,#2a5298)}
header img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:5px solid #fff}
section{padding:40px 20px;max-width:1000px;margin:auto}
h2{text-align:center}
iframe{width:100%;height:315;border-radius:12px;border:none}
.gallery img{width:100%;border-radius:12px;display:none}
.gallery img.active{display:block}
.social a{display:inline-block;margin:8px;padding:10px 15px;border:1px solid #555;border-radius:6px;color:#fff;text-decoration:none}
.social a:hover{background:#2a5298}
footer{text-align:center;padding:20px;background:#111}
</style>
</head>
<body>

<header>
<img src="main_photo.jpg" alt="Keith">
<h1>Keith Bryan Sugnot</h1>
<p>Event Singer • Live & Cover Songs</p>
</header>

<section>
<h2>🔥 Most Viewed Performance</h2>
<div id="liveStatus">Loading...</div>
<iframe id="ytPlayer" allowfullscreen></iframe>
</section>

<section>
<h2>🖼 Gallery</h2>
<div class="gallery" id="gallery">
<img src="keith2.jpg">
<img src="keith3.jpg">
<img src="keith4.jpg">

<section>

<div class="social">

</div>
</section>

<section>

<form action="https://formsubmit.co/sugnotk@gmail.com" method="POST">
<input type="text" name="name" placeholder="Your Name" required>
<input type="text" name="contact" placeholder="Contact Number" required>
<textarea name="message" placeholder="Message"></textarea>
<button type="submit">Send</button>
</form>
</section>

<footer>
© 2026 Keith Bryan Sugnot
</footer>

<script>
/* ===========================
   🔥 YOUTUBE MOST VIEWED
   WITH CACHE SYSTEM
=========================== */

const API_KEY = "ILAGAY_DITO_BAGONG_API_KEY_MO";
const CHANNEL_ID = "UCefBEmdYeUm65g9LXWkTFrw";

const ytPlayer = document.getElementById("ytPlayer");
const liveStatusEl = document.getElementById("liveStatus");

const CACHE_KEY = "ytMostViewedCache";
const CACHE_DURATION = 6 * 60 * 60 * 1000;

function loadCache(){
    const cached = localStorage.getItem(CACHE_KEY);
    if(!cached) return null;
    const data = JSON.parse(cached);
    if(Date.now() - data.time < CACHE_DURATION){
        return data;
    }
    return null;
}

function saveCache(video){
    localStorage.setItem(CACHE_KEY, JSON.stringify({
        ...video,
        time: Date.now()
    }));
}

async function fetchMostViewed(){
    const res = await fetch(
    `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet,id&order=viewCount&maxResults=1&type=video`
    );
    const data = await res.json();
    const video = data.items[0];
    return {
        id: video.id.videoId,
        title: video.snippet.title
    };
}

async function initVideo(){
    const cached = loadCache();

    if(cached){
        ytPlayer.src = "https://www.youtube.com/embed/" + cached.id;
        liveStatusEl.innerHTML = cached.title;
        fetchMostViewed().then(fresh => saveCache(fresh));
    } else {
        const fresh = await fetchMostViewed();
        saveCache(fresh);
        ytPlayer.src = "https://www.youtube.com/embed/" + fresh.id;
        liveStatusEl.innerHTML = fresh.title;
    }
}

initVideo();

/* ===========================
   🖼 GALLERY SLIDESHOW
=========================== */

const images = document.querySelectorAll("#gallery img");
let index = 0;
if(images.length > 0){
    images[0].classList.add("active");
    setInterval(()=>{
        images[index].classList.remove("active");
        index = (index+1) % images.length;
        images[index].classList.add("active");
    },3000);
}

/* ===========================
   🚀 SERVICE WORKER
=========================== */

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
